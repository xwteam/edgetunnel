name: Sync Fallback

# 「Upstream Sync」失败时自动兜底，省去人工去点 Sync Fork。
#
# 背景：sync.yml 在合并上游产生冲突时会 exit 1 并提示「请手动 Sync Fork」。
#       2026-09-05 ~ 09-18 它就这样连续失败了 14 天，期间上游更新完全没进来。
#
# 本仓库相对上游【只新增了 .github/workflows 下的几个文件，对上游代码零修改】，
# 所以冲突时直接以上游为准是安全的：强制对齐 upstream/main，再把本地独有的
# workflow 文件放回去。这样永远不需要人工介入。

on:
  workflow_run:
    workflows: ["Upstream Sync"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fallback
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    # 只在 Upstream Sync 真的失败时才动手
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Force-align with upstream, keep local workflows
        run: |
          set -euo pipefail
          git config user.name  "GH Action - Sync Fallback"
          git config user.email "action@github.com"

          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          if git diff --quiet HEAD upstream/main; then
            echo "内容已与上游一致，无需兜底。"
            exit 0
          fi

          # 保存本仓库独有的 workflow（上游没有这些文件）
          mkdir -p /tmp/keep
          for f in deploy-mirror.yml sync-fallback.yml; do
            [ -f ".github/workflows/$f" ] && cp ".github/workflows/$f" /tmp/keep/ || true
          done
          # 本仓库独有的订阅转换模板，同样要保住
          [ -d sub-config ] && cp -r sub-config /tmp/keep-subconfig || true

          git reset --hard upstream/main
          mkdir -p .github/workflows
          cp /tmp/keep/. .github/workflows/ -r 2>/dev/null || true
          [ -d /tmp/keep-subconfig ] && cp -r /tmp/keep-subconfig sub-config || true

          if git diff --quiet && git diff --cached --quiet; then
            echo "对齐后无差异，直接推送对齐结果。"
          else
            git add -A .github/workflows
            git commit -m "sync: 冲突兜底，强制对齐上游并保留本地部署配置"
          fi

          git push --force-with-lease origin main
          echo "✅ 已强制对齐上游，本地 workflow 已保留。"
