[custom]
;==============================================================
; 自用订阅转换模板（基于 ACL4SSR_Online_Mini_MultiMode_CF 改造）
;
; 改造点：
;   1. 节点重命名为「国旗 + 英文国名 + 序号」，如 🇸🇬 Singapore 01
;   2. rename 用通用正则，不写死 SUBNAME，换节点/改名后仍然生效
;   3. 分组不含任何地区组，避免出现无节点的空组
;
; 注意：使用本模板时订阅转换配置请设 SUBEMOJI=false，
;       国旗已由下方 rename 规则写入，重复开启会叠加两个旗子。
;==============================================================

;-------------------- 节点重命名 --------------------
; 匹配形如 XX-任意-01 的节点名（XX 为 subconverter 按 GeoIP 生成的国家代码）
; [^0-9]* 兼容任意中间段，因此 SUBNAME 改成什么都不受影响

;— 亚洲 —
rename=^HK[^0-9]*(\d+)$@🇭🇰 Hong Kong $1
rename=^TW[^0-9]*(\d+)$@🇹🇼 Taiwan $1
rename=^JP[^0-9]*(\d+)$@🇯🇵 Japan $1
rename=^KR[^0-9]*(\d+)$@🇰🇷 Korea $1
rename=^SG[^0-9]*(\d+)$@🇸🇬 Singapore $1
rename=^MY[^0-9]*(\d+)$@🇲🇾 Malaysia $1
rename=^TH[^0-9]*(\d+)$@🇹🇭 Thailand $1
rename=^VN[^0-9]*(\d+)$@🇻🇳 Vietnam $1
rename=^PH[^0-9]*(\d+)$@🇵🇭 Philippines $1
rename=^ID[^0-9]*(\d+)$@🇮🇩 Indonesia $1
rename=^IN[^0-9]*(\d+)$@🇮🇳 India $1
rename=^AE[^0-9]*(\d+)$@🇦🇪 Dubai $1
rename=^IL[^0-9]*(\d+)$@🇮🇱 Israel $1
rename=^KZ[^0-9]*(\d+)$@🇰🇿 Kazakhstan $1

;— 欧洲 —
rename=^DE[^0-9]*(\d+)$@🇩🇪 Germany $1
rename=^NL[^0-9]*(\d+)$@🇳🇱 Netherlands $1
rename=^GB[^0-9]*(\d+)$@🇬🇧 United Kingdom $1
rename=^UK[^0-9]*(\d+)$@🇬🇧 United Kingdom $1
rename=^FR[^0-9]*(\d+)$@🇫🇷 France $1
rename=^IT[^0-9]*(\d+)$@🇮🇹 Italy $1
rename=^ES[^0-9]*(\d+)$@🇪🇸 Spain $1
rename=^CH[^0-9]*(\d+)$@🇨🇭 Switzerland $1
rename=^SE[^0-9]*(\d+)$@🇸🇪 Sweden $1
rename=^NO[^0-9]*(\d+)$@🇳🇴 Norway $1
rename=^FI[^0-9]*(\d+)$@🇫🇮 Finland $1
rename=^DK[^0-9]*(\d+)$@🇩🇰 Denmark $1
rename=^PL[^0-9]*(\d+)$@🇵🇱 Poland $1
rename=^AT[^0-9]*(\d+)$@🇦🇹 Austria $1
