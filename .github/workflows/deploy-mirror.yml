name: Deploy Mirror

# 上游同步完成后自动部署到 Cloudflare Workers（目标由仓库 secrets 指定）。
#
# 触发链路：
#   上游仓库更新
#     └─> Upstream Sync（sync.yml，每天 UTC 00:00）合并进本 fork 的 main
#           └─> 本 workflow 经 workflow_run 触发并部署
#
# ⚠️ 为什么用 workflow_run 而不是 on:push —— GitHub 规定：用内置 GITHUB_TOKEN
#    推送产生的 push 事件【不会】触发其它 workflow（防无限循环）。sync.yml 正是
#    用 GITHUB_TOKEN 推的，所以单靠 on:push 永远不会跑。两个触发都留着做双保险。

on:
  workflow_run:
    workflows: ["Upstream Sync"]
    types: [completed]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'CHANGELOG'
      - 'LICENSE'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mirror
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # 只取入口脚本。仓库自带的 wrangler.toml 是上游的（name 是版本号，会随上游漂移），
      # 这里另建一份自己的，避免部署目标被上游改名带偏。
      - name: Prepare artifact
        env:
          WORKER_NAME: ${{ secrets.CF_MIRROR_NAME }}
          KV_ID: ${{ secrets.CF_MIRROR_KV }}
        run: |
          set -euo pipefail
          test -f _worker.js || { echo "::error::_worker.js 缺失，中止部署"; exit 1; }
          mkdir -p /tmp/out
          cp _worker.js /tmp/out/
          cat > /tmp/out/wrangler.toml <<EOF
          name = "${WORKER_NAME}"
          main = "_worker.js"
          compatibility_date = "2026-05-29"
          keep_vars = true

          [[kv_namespaces]]
          binding = "KV"
          id = "${KV_ID}"
          EOF
          echo "--- 部署产物 ---"; ls -la /tmp/out

      - name: Deploy to Cloudflare Workers
        working-directory: /tmp/out
        run: npx --yes wrangler@4.135.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_MIRROR_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_MIRROR_ACCOUNT }}
